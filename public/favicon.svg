<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="afcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <!-- Circular Badge Background -->
  <circle cx="256" cy="256" r="246" fill="url(#afcGrad)" stroke="url(#goldGrad)" stroke-width="12" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
  
  <!-- Stylized Japanese Floral Crest / Ribbon Silhouette -->
  <path d="M 210 135 C 230 115 282 115 302 135 C 315 150 315 170 300 185 C 280 205 232 205 212 185 C 197 170 197 150 210 135 Z" fill="url(#goldGrad)" opacity="0.85" />
  <circle cx="256" cy="155" r="14" fill="#fff" opacity="0.9" />

  <!-- AFC Bold Typographic Mark -->
  <text x="256" y="305" font-family="'Plus Jakarta Sans', 'Outfit', -apple-system, sans-serif" font-weight="900" font-size="124" fill="#ffffff" text-anchor="middle" letter-spacing="4">AFC</text>
  
  <!-- Japanese Sub-Text -->
  <text x="256" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="34" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">JAPAN</text>
  
  <!-- Medical / Life Science Star Accent -->
  <polygon points="256,405 261,418 274,420 264,430 267,443 256,436 245,443 248,430 238,420 251,418" fill="url(#goldGrad)" />
</svg>
